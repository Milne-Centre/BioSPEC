name: Update BioSPEC Benchmarks

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs automatically every Sunday at midnight UTC
  workflow_dispatch:      # Allows manual triggering from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib

    - name: Generate Benchmark Artifacts
      run: python generate_benchmarks.py

    - name: Commit and Push Updated Benchmarks
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add summary_stats.json method_boxplots.png best_method_histograms.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BioSPEC benchmark plots [skip ci]" && git push)
